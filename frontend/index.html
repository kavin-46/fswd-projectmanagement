<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Management Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN -->

    <div class="auth-container" id="loginPage">

        <h1>Project Manager</h1>
        <h2>Login</h2>

        <input id="loginId" placeholder="Enter User ID">

        <input id="loginPassword" type="password"
        placeholder="Enter Password">

        <button onclick="login()">Login</button>

        <p>New user?
            <a onclick="showRegister()">Register</a>
        </p>

    </div>

    <!-- REGISTER -->

    <div class="auth-container" id="registerPage"
    style="display:none">

        <h1>Project Manager</h1>
        <h2>Create Account</h2>

        <input id="registerId" placeholder="Create User ID">

        <input id="registerPassword" type="password"
        placeholder="Create Password">

        <button onclick="register()">Register</button>

        <p>Already registered?
            <a onclick="showLogin()">Login</a>
        </p>

    </div>

    <!-- DASHBOARD -->

    <div id="dashboardPage" style="display:none">

        <header>

            <h1>Project Management Dashboard</h1>

            <div>
                <span id="welcome"></span>
                <button onclick="logout()">Logout</button>
            </div>

        </header>

        <!-- STATISTICS -->

        <section class="stats">

            <div class="card">
                <h3>Total Tasks</h3>
                <h2 id="total">0</h2>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <h2 id="pending">0</h2>
            </div>

            <div class="card">
                <h3>In Progress</h3>
                <h2 id="progress">0</h2>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <h2 id="completed">0</h2>
            </div>

        </section>

        <!-- TASK MANAGEMENT -->

        <main class="main-container">

            <h2>Add New Task</h2>

            <div class="add-task">

                <input id="taskName"
                placeholder="Enter task name">

                <button onclick="addTask()">Add Task</button>

            </div>

            <h2>My Tasks</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Task Name</th>
                            <th>Status</th>
                            <th>Update Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="taskList"></tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
